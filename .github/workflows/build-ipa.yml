name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned app
        run: |
          xcodebuild -project XiaoYuMuJiZhang.xcodeproj -scheme XiaoYuMuJiZhang -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/XiaoYuMuJiZhang.app Payload/
          zip -r XiaoYuMuJiZhang-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XiaoYuMuJiZhang-unsigned-ipa
          path: XiaoYuMuJiZhang-unsigned.ipa
